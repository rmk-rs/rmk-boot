[tasks.uf2-nrf52833]
dependencies = ["copy-x-nrf52833", "objcopy-nrf52833"]
command = "cargo"
args = ["hex-to-uf2", "--input-path", "rmk-boot-nrf52833.hex", "--output-path", "rmk-boot-nrf52833.uf2", "--family", "0x621E937A"]

[tasks.uf2-nrf52840]
dependencies = ["copy-x-nrf52840", "objcopy-nrf52840"]
command = "cargo"
args = ["hex-to-uf2", "--input-path", "rmk-boot-nrf52840.hex", "--output-path", "rmk-boot-nrf52840.uf2", "--family", "nrf52840"]

[tasks.uf2-all]
dependencies = ["uf2-2mb", "uf2-4mb", "uf2-8mb", "uf2-16mb", "uf2-nrf52840", "uf2-nrf52833", "uf2-2mb-noswap", "uf2-4mb-noswap", "uf2-8mb-noswap", "uf2-16mb-noswap", "uf2-nrf52840-noswap", "uf2-nrf52833-noswap"]

