[tasks.build-nrf]
command = "cargo"
args = ["build", "--release", "--target", "thumbv7em-none-eabihf", "--features", "nrf52840"]

[tasks.copy-x-nrf]
dependencies = ["build-nrf"]
script = [
'''
if [ ! -f rmk-boot.x ]; then
    touch build.rs
    cargo build --release --target thumbv7em-none-eabihf --features nrf52840
fi
cp rmk-boot.x rmk-boot-nrf52840.x
