[tasks.install-llvm-tools]
install_crate = { rustup_component_name = "llvm-tools" }

[tasks.flip-link]
install_crate = { crate_name = "flip-link", binary = "flip-link", test_arg = ["-h"] }

[tasks.build-2mb]
command = "cargo"
args = ["build", "--release", "--target", "thumbv6m-none-eabi", "--features", "rp2040-2mb"]

[tasks.copy-x-2mb]
dependencies = ["build-2mb"]
script = [
'''
if [ ! -f rmk-boot.x ]; then
    touch build.rs
    cargo build --release --target thumbv6m-none-eabi --features rp2040-2mb
fi
cp rmk-boot.x rmk-boot-rp2040-2mb.x
'''
]

[tasks.build-4mb]
command = "cargo"
args = ["build", "--release", "--target", "thumbv6m-none-eabi", "--features", "rp2040-4mb"]

[tasks.copy-x-4mb]
dependencies = ["build-4mb"]
script = [
'''
if [ ! -f rmk-boot.x ]; then
    touch build.rs
    cargo build --release --target thumbv6m-none-eabi --features rp2040-4mb
fi
cp rmk-boot.x rmk-boot-rp2040-4mb.x
'''
]

[tasks.build-8mb]
command = "cargo"
args = ["build", "--release", "--target", "thumbv6m-none-eabi", "--features", "rp2040-8mb"]

[tasks.copy-x-8mb]
dependencies = ["build-8mb"]
script = [
'''
if [ ! -f rmk-boot.x ]; then
    touch build.rs
    cargo build --release --target thumbv6m-none-eabi --features rp2040-8mb
fi
cp rmk-boot.x rmk-boot-rp2040-8mb.x
'''
]

[tasks.build-16mb]
command = "cargo"
args = ["build", "--release", "--target", "thumbv6m-none-eabi", "--features", "rp2040-16mb"]

[tasks.copy-x-16mb]
dependencies = ["build-16mb"]
script = [
'''
