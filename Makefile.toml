[tasks.uf2-nrf]
dependencies = ["copy-x-nrf", "objcopy-nrf"]
command = "cargo"
args = ["hex-to-uf2", "--input-path", "rmk-boot-nrf52840.hex", "--output-path", "rmk-boot-nrf52840.uf2", "--family", "nrf52840"]

[tasks.uf2-all]
dependencies = ["uf2-2mb", "uf2-4mb", "uf2-8mb", "uf2-16mb", "uf2-nrf"]
