name: Release rmk-boot

on:
  push:
    tags:
        - 'rmk-boot-v[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust targets
        run: rustup target add thumbv6m-none-eabi thumbv7em-none-eabihf

      - name: Install build tools
        run: cargo install cargo-make cargo-binutils cargo-hex-to-uf2

      - name: Build all UF2 variants
        run: cargo make uf2-all

      - name: Copy nRF ELFs
        run: |
          cp target/thumbv7em-none-eabihf/release/rmk-boot rmk-boot-nrf52840.elf
          cargo build --release --target thumbv7em-none-eabihf --features nrf52833
          cp target/thumbv7em-none-eabihf/release/rmk-boot rmk-boot-nrf52833.elf
          cargo build --release --target thumbv7em-none-eabihf --features nrf52840,noswap
          cp target/thumbv7em-none-eabihf/release/rmk-boot rmk-boot-nrf52840-noswap.elf
          cargo build --release --target thumbv7em-none-eabihf --features nrf52833,noswap
          cp target/thumbv7em-none-eabihf/release/rmk-boot rmk-boot-nrf52833-noswap.elf

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.uf2
            *.hex
            *.x
            rmk-boot-nrf52840.elf
            rmk-boot-nrf52833.elf
            rmk-boot-nrf52840-noswap.elf
            rmk-boot-nrf52833-noswap.elf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}